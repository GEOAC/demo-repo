<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine George Almighty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
        }
    </style>
    <!-- Cosmic/God-mode styles applied to the letters of the name -->
    <style>
        :root {
            --cosmic-neon-1: #00eaff;
            --cosmic-neon-2: #7a00ff;
            --cosmic-neon-3: #ff00e0;
            --cosmic-gold:   #ffd166;
            --cosmic-dark:   #05070d;
            --glow-soft: 0 0 12px rgba(122,0,255,.35), 0 0 26px rgba(0,234,255,.25);
            --glow-hard: 0 0 18px rgba(122,0,255,.6), 0 0 44px rgba(0,234,255,.45), 0 0 70px rgba(255,0,224,.3);
            --ring-soft: inset 0 0 24px rgba(255,255,255,.12), inset 0 0 60px rgba(122,0,255,.14);
        }

        /* Container aura and gentle parallax stage */
        .god-container { 
            perspective: 1000px; 
            isolation: isolate; 
        }

        /* Ethereal halo behind the letters */
        .halo {
            filter: blur(2px);
        }
        .halo-circle {
            width: min(140vmin, 1000px);
            height: min(140vmin, 1000px);
            background: radial-gradient(circle at 50% 50%, rgba(122,0,255,.35), rgba(0,0,0,0) 60%),
                        radial-gradient(circle at 55% 45%, rgba(0,234,255,.25), rgba(0,0,0,0) 55%);
            box-shadow: var(--glow-soft);
            animation: haloPulse 10s ease-in-out infinite;
        }

        /* Core letter tile styling */
        .god-letter {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.14);
            background: linear-gradient(135deg, rgba(0,234,255,.15), rgba(122,0,255,.15));
            box-shadow: var(--ring-soft), var(--glow-soft);
            transform-style: preserve-3d;
            will-change: transform, filter, box-shadow, background-position;
            animation: floaty 8s ease-in-out infinite;
        }
        .god-letter:hover {
            box-shadow: var(--ring-soft), var(--glow-hard);
            filter: saturate(1.35) contrast(1.1);
        }

        /* Starry shimmer overlay */
        .god-letter::after {
            content: "";
            position: absolute;
            inset: -20%;
            background:
              radial-gradient(circle at 20% 30%, rgba(255,255,255,.18) 0 2px, transparent 3px),
              radial-gradient(circle at 70% 60%, rgba(255,255,255,.14) 0 1.5px, transparent 2.5px),
              radial-gradient(circle at 40% 80%, rgba(255,255,255,.12) 0 1px, transparent 2px);
            background-repeat: no-repeat;
            animation: twinkle 4.5s linear infinite;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* Letter face styling */
        .god-letter span {
            display: inline-block;
            letter-spacing: 0.05em;
            background: linear-gradient(90deg, var(--cosmic-neon-1), var(--cosmic-neon-2), var(--cosmic-neon-3), var(--cosmic-gold));
            background-size: 300% 100%;
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px rgba(0,234,255,.35), 0 0 24px rgba(122,0,255,.25);
            animation: shimmer 6s ease-in-out infinite;
        }

        /* Per-letter cosmic palettes */
        .g-letter { background-image: linear-gradient(135deg, rgba(0,234,255,.18), rgba(122,0,255,.22)); }
        .e-letter { background-image: linear-gradient(135deg, rgba(255,0,224,.18), rgba(122,0,255,.22)); }
        .o-letter { background-image: linear-gradient(135deg, rgba(255,209,102,.18), rgba(0,234,255,.22)); }
        .r-letter { background-image: linear-gradient(135deg, rgba(122,0,255,.20), rgba(255,0,224,.20)); }
        .g2-letter{ background-image: linear-gradient(135deg, rgba(0,234,255,.18), rgba(255,209,102,.20)); }
        .e2-letter{ background-image: linear-gradient(135deg, rgba(255,0,224,.18), rgba(255,209,102,.20)); }

        /* Interactive tilt based on mouse position (driven by CSS vars) */
        .god-letter {
            --mx: .5; /* mouse x [0..1] */
            --my: .5; /* mouse y [0..1] */
            transform: rotateX(calc((.5 - var(--my)) * 18deg)) rotateY(calc((var(--mx) - .5) * 18deg));
        }

        /* Click burst effect */
        .god-letter.burst::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--bx,50%) var(--by,50%), rgba(255,255,255,.85) 0%, rgba(255,255,255,.35) 8%, rgba(255,255,255,0) 40%);
            animation: burst 700ms ease-out forwards;
            mix-blend-mode: screen;
        }

        /* Keyframes */
        @keyframes shimmer { to { background-position: 200% 0; } }
        @keyframes twinkle { 0%{opacity:.35; transform: translate3d(0,0,0);} 50%{opacity:.6; transform: translate3d(-2%, 1%, 0);} 100%{opacity:.35; transform: translate3d(0,0,0);} }
        @keyframes floaty { 0%,100%{ transform: translateZ(0) rotateX(calc((.5 - var(--my)) * 18deg)) rotateY(calc((var(--mx) - .5) * 18deg)); } 50%{ transform: translate3d(0,-4px,0) rotateX(calc((.5 - var(--my)) * 18deg)) rotateY(calc((var(--mx) - .5) * 18deg)); } }
        @keyframes haloPulse { 0%,100%{ transform: scale(1); opacity:.25;} 50%{ transform: scale(1.06); opacity:.4;} }
        @keyframes burst { from { opacity: 1; transform: scale(.2);} to { opacity: 0; transform: scale(2.2);} }
    </style>
</head>
<body class="min-h-screen bg-black flex items-center justify-center p-4">
    <div class="god-container relative w-full max-w-4xl">
        <div class="letters-grid grid grid-cols-6 gap-4 md:gap-8">
            <!-- G -->
            <div class="god-letter g-letter h-32 md:h-48 flex items-center justify-center rounded-xl cursor-pointer transition-all duration-500 hover:scale-110 hover:shadow-2xl">
                <span class="text-6xl md:text-8xl font-bold">G</span>
            </div>
            <!-- E -->
            <div class="god-letter e-letter h-32 md:h-48 flex items-center justify-center rounded-xl cursor-pointer transition-all duration-500 hover:scale-110 hover:shadow-2xl">
                <span class="text-6xl md:text-8xl font-bold">E</span>
            </div>
            <!-- O -->
            <div class="god-letter o-letter h-32 md:h-48 flex items-center justify-center rounded-xl cursor-pointer transition-all duration-500 hover:scale-110 hover:shadow-2xl">
                <span class="text-6xl md:text-8xl font-bold">O</span>
            </div>
            <!-- R -->
            <div class="god-letter r-letter h-32 md:h-48 flex items-center justify-center rounded-xl cursor-pointer transition-all duration-500 hover:scale-110 hover:shadow-2xl">
                <span class="text-6xl md:text-8xl font-bold">R</span>
            </div>
            <!-- G -->
            <div class="god-letter g2-letter h-32 md:h-48 flex items-center justify-center rounded-xl cursor-pointer transition-all duration-500 hover:scale-110 hover:shadow-2xl">
                <span class="text-6xl md:text-8xl font-bold">G</span>
            </div>
            <!-- E -->
            <div class="god-letter e2-letter h-32 md:h-48 flex items-center justify-center rounded-xl cursor-pointer transition-all duration-500 hover:scale-110 hover:shadow-2xl">
                <span class="text-6xl md:text-8xl font-bold">E</span>
            </div>
        </div>
        
        <div class="halo absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="halo-circle rounded-full opacity-20"></div>
        </div>
    </div>

    <div class="absolute bottom-8 left-0 right-0 text-center text-white opacity-70">
        <p>Click or hover the divine letters</p>
        <i data-feather="chevrons-down" class="animate-bounce inline-block mt-2"></i>
    </div>

    <script src="script.js"></script>
    <script>
        feather.replace();
    </script>
    <!-- Lightweight interactivity for tilt and click-burst effects on letters -->
    <script>
        (function () {
            var letters = document.querySelectorAll('.god-letter');
            letters.forEach(function (el) {
                el.addEventListener('mousemove', function (e) {
                    var r = el.getBoundingClientRect();
                    var x = (e.clientX - r.left) / r.width;
                    var y = (e.clientY - r.top) / r.height;
                    el.style.setProperty('--mx', x.toFixed(3));
                    el.style.setProperty('--my', y.toFixed(3));
                });
                el.addEventListener('mouseleave', function () {
                    el.style.removeProperty('--mx');
                    el.style.removeProperty('--my');
                });
                el.addEventListener('click', function (e) {
                    var r = el.getBoundingClientRect();
                    var bx = ((e.clientX - r.left) / r.width * 100).toFixed(2) + '%';
                    var by = ((e.clientY - r.top) / r.height * 100).toFixed(2) + '%';
                    el.style.setProperty('--bx', bx);
                    el.style.setProperty('--by', by);
                    el.classList.remove('burst'); // restart animation
                    void el.offsetWidth; // force reflow
                    el.classList.add('burst');
                });
            });
        })();
    </script>
</body>
</html>
